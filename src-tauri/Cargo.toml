[package]
name = "aether"
version = "0.1.0"
description = "Project Aether desktop application"
authors = ["Alex Markham"]
edition = "2021"

[lib]
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[dev-dependencies]
serde_json = "1"
